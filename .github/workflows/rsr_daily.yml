name: RSR Trading Run
 
on:
  schedule:
    # Every hour during market hours: 9 AM - 5 PM ET (14:00-22:00 UTC), Mon-Fri
    - cron: "0 14-22 * * 1-5"
  workflow_dispatch:
 
# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write
 
jobs:
  run-rsr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
 
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Download NLP models
        run: |
          python -m nltk.downloader stopwords wordnet omw-1.4 vader_lexicon -q
          python -m spacy download en_core_web_sm -q
 
      - name: Run RSR pipeline
        env:
          NEWSAPI_KEY:       ${{ secrets.NEWSAPI_KEY }}
          REDDIT_CLIENT_ID:  ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET:     ${{ secrets.REDDIT_SECRET }}
          AV_KEY:            ${{ secrets.AV_KEY }}
        run: python pipeline/daily_run.py
 
      - name: Commit portfolio state back to repo
        run: |
          git config user.name "RSR Bot"
          git config user.email "rsr-bot@users.noreply.github.com"
          git add -f data/portfolio.json data/sentiment/ || true
          git diff --staged --quiet || git commit -m "RSR auto: portfolio update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
 
      - name: Generate live dashboard
        run: python pipeline/build_dashboard.py
 
      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "RSR dashboard update — ${{ github.run_id }}"